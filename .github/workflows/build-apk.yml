name: Build VideoLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q VideoLabAndroid-MVP.zip -d extracted
          echo "Project contents:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Find Android project
        id: project
        run: |
          PROJECT=$(find extracted -name "settings.gradle.kts" -printf '%h\n' | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoLab-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
